name: Faker cross-platform system tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: TC21-TC23 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout test project
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up the same PHP version
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '7.4.33'
          extensions: dom, json, mbstring, xml, xmlwriter, tokenizer, phar, intl, openssl
          ini-values: date.timezone=UTC, memory_limit=256M, precision=14, serialize_precision=-1
          coverage: none
      - name: Download and verify pinned tools
        run: php scripts/download-tools.php
      - name: Install exact locked dependencies and check real platform requirements
        run: php scripts/install.php
      - name: Execute TC01-TC20 and capture evidence
        run: php scripts/run-tests.php
      - name: Upload this platform's logs and reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faker-results-${{ matrix.os }}
          path: |
            results/
            !results/evidence/
          if-no-files-found: error
          retention-days: 30

  compare:
    name: TC24 compare three operating systems
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout comparison script
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '7.4.33'
          extensions: dom, json
          coverage: none
      - name: Download all available OS reports
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: faker-results-*
          path: results/imported
          merge-multiple: false
      - name: Require complete and consistent results
        run: php scripts/compare-results.php results/imported results/comparison
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: faker-cross-platform-comparison
          path: results/comparison/
          if-no-files-found: error
          retention-days: 30
